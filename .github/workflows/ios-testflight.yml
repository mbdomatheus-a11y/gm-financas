name: iOS TestFlight

# Compila o app iOS em um Mac do GitHub (gratuito para repositório público) e envia ao TestFlight.
# Dispara manualmente (Actions > iOS TestFlight > Run workflow) ou a cada push na branch ios-app.
on:
  workflow_dispatch:
  push:
    branches: [ios-app]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: WG63N8W37M
      BUNDLE_ID: co.median.ios.nmlbjjq
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependências e sincroniza o projeto iOS
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios
          cd ios/App
          pod install

      - name: Compila e envia ao TestFlight (fastlane)
        run: |
          gem install fastlane -N || true
          fastlane ios testflight
