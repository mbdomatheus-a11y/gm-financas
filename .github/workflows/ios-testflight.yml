name: iOS TestFlight

# Compila o app iOS em um Mac do GitHub (gratuito para repositório público) e envia ao TestFlight.
# Dispara manualmente (Actions > iOS TestFlight > Run workflow) ou a cada push na branch ios-app.
on:
  workflow_dispatch:
  push:
    branches: [ios-app]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: WG63N9W37M
      BUNDLE_ID: co.median.ios.nmlbjjq
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependências e sincroniza o projeto iOS
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios
          cd ios/App
          pod install

      - name: Importa o certificado de distribuição
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$RUNNER_TEMP/build.keychain" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain-db
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain"

      - name: Compila e envia ao TestFlight (fastlane)
        run: |
          gem install fastlane -N || true
          fastlane ios enviar_testflight
